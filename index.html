<!DOCTYPE html>

<title>ما الذي يجعل طالباً يختار الهندسة الصناعية؟ | جامعة السلطان قابوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1F3D; --navy-2:#102C55; --blue-700:#14448A; --blue-500:#1F6FD1; --blue-400:#4C8FE0; --blue-300:#8EBBF2; --blue-100:#E6EFFB;
  --gold:#F2B544; --gold-ink:#5B3D00;
  --ink:#0B2140; --ink-2:#4B6280; --line:#D6E1EE; --paper:#F6F9FD; --card:#FFFFFF; --tint:#EAF2FC;
  --ok:#1E8E62; --bad:#C9443A; --okbg:#E5F4EC; --badbg:#FBEAE8;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-io:cubic-bezier(0.77,0,0.175,1);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"IBM Plex Sans Arabic","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E6EEF8; --ink-2:#9CB2CC; --line:#1E3555; --paper:#081427; --card:#0F2140; --tint:#0D1D38; --blue-100:#14294A;
    --ok:#4CC28F; --bad:#EE7B70; --okbg:#10301F; --badbg:#3A1E1B;
  }
}
:root[data-theme="dark"]{
  --ink:#E6EEF8; --ink-2:#9CB2CC; --line:#1E3555; --paper:#081427; --card:#0F2140; --tint:#0D1D38; --blue-100:#14294A;
  --ok:#4CC28F; --bad:#EE7B70; --okbg:#10301F; --badbg:#3A1E1B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{overflow-x:clip;margin:0;color:var(--ink);background:var(--paper);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-400);outline-offset:3px}
.hidden{display:none!important}
.container{max-width:1080px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--navy) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .container{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{font-weight:600;font-size:14.5px;letter-spacing:.01em;display:flex;gap:10px;align-items:center}
.brand b{font-weight:700}
.brand span{opacity:.7;font-weight:400}
.topbar button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px;transition:background .16s ease}
.topbar button:hover{background:rgba(255,255,255,.1)}

/* ---------- buttons ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:13px 26px;cursor:pointer;font-weight:600;font-size:16px;white-space:nowrap;
  background:var(--blue-500);color:#fff;transition:transform .14s var(--ease-out),background .18s ease,box-shadow .18s ease;box-shadow:0 6px 18px -8px color-mix(in srgb,var(--blue-500) 70%,transparent)}
.btn:hover{background:var(--blue-700)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.ghost:hover{background:color-mix(in srgb,currentColor 8%,transparent)}
.btn.light{background:#fff;color:var(--navy);box-shadow:none}
.btn.light:hover{background:var(--blue-100)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;background:
  radial-gradient(900px 520px at 75% 20%, rgba(76,143,224,.45), transparent 60%),
  radial-gradient(700px 500px at 10% 90%, rgba(20,68,138,.65), transparent 60%),
  linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  min-height:calc(88dvh - 56px);display:flex;align-items:center}
.hero .container{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;padding-top:48px;padding-bottom:56px}
.hero h1{font-size:clamp(32px,4.4vw,52px);line-height:1.15;font-weight:700;margin:0 0 18px;letter-spacing:-.015em}
.hero p{font-size:clamp(17px,1.6vw,20px);color:#C9DAF1;max-width:34ch;margin:0 0 30px;font-weight:300}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn.ghost{color:#fff}
.scale-wrap{position:relative}
.scale-svg{width:100%;height:auto;display:block;overflow:visible}
.scale-svg .pan{cursor:pointer}
.scale-svg .pan:hover .pan-dish{fill:rgba(255,255,255,.16)}
.scale-hint{text-align:center;color:#9FBCE6;font-size:14px;margin-top:6px}
.scale-svg text{font-family:inherit}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease-out),transform .7s var(--ease-out)}
.reveal.in{opacity:1;transform:none}

/* ---------- sections ---------- */
section.block{padding:96px 0}
.block h2{font-size:clamp(28px,3.6vw,42px);line-height:1.2;margin:0 0 14px;letter-spacing:-.01em}
.block .sub{font-size:18px;color:var(--ink-2);max-width:60ch;margin:0 0 48px}

/* steps */
.steps{display:flex;flex-direction:column;gap:20px}
.step{display:grid;grid-template-columns:260px 1fr;gap:36px;align-items:center;padding:28px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.step h3{font-size:24px;margin:0 0 6px}
.step p{margin:0;color:var(--ink-2);max-width:52ch}
.step .ill{border-radius:14px;background:linear-gradient(160deg,var(--tint),color-mix(in srgb,var(--blue-300) 22%,var(--card)));aspect-ratio:13/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ill svg{width:88%;height:auto}
/* step 1: moving dot */
.ill .mv{transform:translateX(0);transition:transform 1s var(--ease-io) .3s}
.step.in .ill .mv{transform:translateX(-58px)}
html[dir="rtl"] .step.in .ill .mv{transform:translateX(58px)}
.ill .win{transition:fill .5s ease 1.1s}
.step.in .ill .win{fill:var(--blue-500)}
.step.in .ill .wintext{fill:#fff}
.ill .wintext{transition:fill .5s ease 1.1s}
/* step 2: draw check */
.ill .edge{stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset .8s var(--ease-out)}
.step.in .ill .edge{stroke-dashoffset:0}
.step.in .ill .edge.e2{transition-delay:.35s}.step.in .ill .edge.e3{transition-delay:.7s}
.ill .chk{stroke-dasharray:40;stroke-dashoffset:40;transition:stroke-dashoffset .5s var(--ease-out) 1.3s}
.step.in .ill .chk{stroke-dashoffset:0}
.ill .chkbg{opacity:0;transform-origin:center;transform-box:fill-box;transform:scale(.6);transition:opacity .3s ease 1.15s,transform .4s var(--ease-out) 1.15s}
.step.in .ill .chkbg{opacity:1;transform:none}
/* step 3: bars */
.ill .bar3{transform-origin:bottom;transform-box:fill-box;transform:scaleY(.05);transition:transform 1s var(--ease-out)}
.step.in .ill .bar3{transform:none}
.step.in .ill .b2{transition-delay:.15s}.step.in .ill .b3{transition-delay:.3s}

/* demo */
.demo{background:linear-gradient(180deg,var(--paper),var(--tint))}
.demo-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start}
.demo-out{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.demo-out h3{margin:0 0 4px;font-size:18px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;transition:background .2s ease,color .2s ease}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.bad{background:var(--badbg);color:var(--bad)}
.demo-note{font-size:14px;color:var(--ink-2);margin-top:14px}

/* comparison card (shared by demo + survey) */
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;margin:14px 0;transition:border-color .2s ease,box-shadow .2s ease}
.q:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--blue-400) 18%,transparent)}
.q-head{display:flex;justify-content:flex-end}
.q-num{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:2px 0 12px}
.item{font-weight:600;font-size:16.5px;line-height:1.35;transition:color .18s ease}
.item.b{text-align:end}
.item.win{color:var(--blue-500)}
.vs{font-size:13px;color:var(--ink-2)}
.item details{font-weight:inherit}
.item summary{cursor:pointer;list-style:none;display:inline}
.item summary::-webkit-details-marker{display:none}
.item summary .t{border-bottom:1.5px dotted color-mix(in srgb,currentColor 55%,transparent)}
.item .def{font-size:13.5px;color:var(--ink-2);font-weight:400;margin-top:4px}
.scale{display:flex;align-items:center;justify-content:space-between;gap:2px;padding:6px 2px 2px;position:relative}
.scale::before{content:"";position:absolute;inset-inline:8px;top:50%;height:2px;background:linear-gradient(90deg,var(--blue-300),var(--line) 40%,var(--line) 60%,var(--blue-300));transform:translateY(-1px)}
.stop{position:relative;z-index:1;display:flex;flex:1 1 0;min-width:0;justify-content:center;cursor:pointer;padding:6px 0;--k:1}
.stop input{position:absolute;opacity:0;pointer-events:none}
.stop span{display:block;flex:none;aspect-ratio:1;width:calc(var(--sz)*var(--k)*1px);height:calc(var(--sz)*var(--k)*1px);border-radius:50%;background:var(--card);border:2px solid color-mix(in srgb,var(--ink-2) 70%,transparent);transition:transform .16s var(--ease-out),background .16s ease-out,border-color .16s ease-out,box-shadow .16s ease-out}
.stop:hover span{border-color:var(--blue-400)}
.stop:active span{transform:scale(.88)}
.stop input:checked+span{background:var(--blue-500);border-color:var(--blue-500);transform:scale(1.18);box-shadow:0 0 0 5px color-mix(in srgb,var(--blue-500) 22%,transparent)}
.stop input:focus-visible+span{outline:3px solid var(--blue-400);outline-offset:3px}
.stop.eq span{border-radius:4px}
.scale-ends{display:grid;grid-template-columns:1fr auto 1fr;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.scale-ends span:last-child{text-align:end}
.reading{min-height:1.6em;margin-top:8px;font-size:14.5px;font-weight:500}
.reading.empty{color:var(--ink-2);font-weight:400}
.q.flag{border-color:var(--bad)} .q.flag .hint{display:block}
.hint{display:none;margin-top:8px;font-size:13.5px;color:var(--bad)}

/* bars */
.bars{margin:12px 0}
.bar{display:grid;grid-template-columns:minmax(120px,40%) 1fr 56px;gap:10px;align-items:center;margin:9px 0;font-size:14.5px}
.bar-track{height:10px}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue-400),var(--blue-500));transition:width .45s var(--ease-out)}
html[dir="rtl"] .bar-fill{background:linear-gradient(270deg,var(--blue-400),var(--blue-500))}
.bar:first-child .bar-fill{background:var(--gold)}
.bar b{font-variant-numeric:tabular-nums;text-align:end}
.cr{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* what you compare */
.lists{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.lists h3{font-size:20px;margin:0 0 4px}
.lists .muted{color:var(--ink-2);margin:0 0 18px;font-size:15px}
.lists ol{list-style:none;margin:0;padding:0}
.lists li{padding:14px 0;border-top:1px solid var(--line)}
.lists li b{display:block;font-weight:600}
.lists li span{color:var(--ink-2);font-size:14.5px}
.facts{display:flex;flex-wrap:wrap;gap:40px;margin-top:56px}
.fact b{display:block;font-size:34px;line-height:1.1;font-weight:700;color:var(--blue-500);font-variant-numeric:tabular-nums}
.fact span{color:var(--ink-2);font-size:15px}

/* final band */
.band{color:#fff;text-align:center;padding:88px 0;background:radial-gradient(700px 360px at 50% 0%,rgba(76,143,224,.5),transparent 70%),linear-gradient(180deg,var(--navy-2),var(--navy))}
.band h2{font-size:clamp(28px,4vw,44px);margin:0 0 10px}
.band p{color:#C9DAF1;margin:0 auto 28px;max-width:46ch}

/* survey */
#survey{padding:28px 0 72px}
.ruler{margin:8px 0 6px}
.ruler-track{position:relative;height:6px;border-radius:999px;background:var(--blue-100);overflow:hidden}
.ruler-fill{position:absolute;top:0;bottom:0;inset-inline-start:0;background:linear-gradient(90deg,var(--blue-400),var(--blue-500));border-radius:999px;transition:width .4s var(--ease-out)}
.ruler-label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:8px}
#app h1{font-size:clamp(26px,3.4vw,34px);line-height:1.25;margin:26px 0 10px;letter-spacing:-.01em}
#app h2{font-size:21px;margin:0 0 8px}
p.lead{font-size:17px;color:var(--ink-2);max-width:62ch;margin:0 0 14px}
.note{font-size:14px;color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span{display:inline-block;padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:var(--card);transition:background .16s ease,color .16s ease,border-color .16s ease,transform .14s var(--ease-out)}
.chip span:active{transform:scale(.97)}
.chip input:checked+span{border-color:var(--blue-500);background:var(--blue-500);color:#fff}
.chip input:focus-visible+span{outline:3px solid var(--blue-400);outline-offset:2px}
label.f{display:block;font-weight:600;margin-top:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:1.4em}
.verdict{border-radius:14px;padding:14px 16px;margin:14px 0;font-weight:500}
.verdict.ok{background:var(--okbg);color:var(--ok)} .verdict.bad{background:var(--badbg);color:var(--bad)}
textarea.code{width:100%;min-height:72px;border:1.5px dashed var(--blue-400);border-radius:14px;padding:14px;background:var(--tint);font-size:15px;direction:ltr;text-align:left;font-variant-numeric:tabular-nums;word-break:break-all}
textarea.paste{width:100%;min-height:160px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);direction:ltr;text-align:left;font-size:14px}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap}
th{font-weight:600;color:var(--ink-2)}
td.yes{color:var(--ok);font-weight:600} td.no{color:var(--bad);font-weight:600}
.done-mark{width:72px;height:72px;margin:28px 0 0}
.done-mark circle{fill:var(--blue-500);transform-origin:center;transform-box:fill-box;animation:pop .45s var(--ease-out) both}
.done-mark path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s var(--ease-out) .25s forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
#app.enter{animation:enter .24s var(--ease-out)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

footer.foot{border-top:1px solid var(--line);padding:22px 0 calc(22px + env(safe-area-inset-bottom,0px));font-size:13.5px;color:var(--ink-2)}
footer.foot .container{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--blue-500);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

@media (max-width:860px){
  .stop{--k:.8}
  .hero .container{grid-template-columns:1fr;text-align:start;padding-top:32px}
  .scale-wrap{max-width:440px;margin:0 auto;width:100%}
  .step{grid-template-columns:1fr;gap:18px;padding:20px}
  .demo-grid{grid-template-columns:1fr}
  .demo-out{position:static}
  .lists{grid-template-columns:1fr;gap:36px}
  section.block{padding:72px 0}
}
@media (max-width:520px){
  .stop{--k:.62}
  .brand span{display:none}
  .bar{grid-template-columns:1fr 56px}
  .bar .bar-track{grid-column:1 / -1;order:3}
  .facts{gap:28px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>

/* ---------- AHP maths ---------- */
function val(code){return code<9?10-code:(code===9?1:1/(code-8));}
function matrixFromVals(vals,n,P){var M=[],i,j;for(i=0;i<n;i++){M.push([]);for(j=0;j<n;j++)M[i].push(1);}
  P.forEach(function(p,k){var v=vals[k];M[p[0]][p[1]]=v;M[p[1]][p[0]]=1/v;});return M;}
function ahp(M){var n=M.length,w=new Array(n).fill(1/n),it,i,j;
  for(it=0;it<200;it++){var nw=[],s=0;for(i=0;i<n;i++){var x=0;for(j=0;j<n;j++)x+=M[i][j]*w[j];nw.push(x);s+=x;}for(i=0;i<n;i++)nw[i]/=s;w=nw;}
  var lam=0;for(i=0;i<n;i++){var y=0;for(j=0;j<n;j++)y+=M[i][j]*w[j];lam+=y/w[i];}lam/=n;
  return {w:w,lam:lam,CR:Math.max(0,((lam-n)/(n-1))/RIx[n])};}
function suggestCode(r){if(r>=1){var v=Math.min(9,Math.max(1,Math.round(r)));return v===1?9:10-v;}var b=Math.min(9,Math.max(1,Math.round(1/r)));return b===1?9:8+b;}
function worstPairs(codes){var M=matrixFromVals(codes.map(val),N,PAIRS),R=ahp(M);
  var dev=PAIRS.map(function(p,k){var e=M[p[0]][p[1]]*R.w[p[1]]/R.w[p[0]];return {k:k,d:Math.abs(Math.log(e)),s:suggestCode(R.w[p[0]]/R.w[p[1]])};});
  dev.sort(function(a,b){return b.d-a.d;});return {R:R,top:dev.slice(0,2).filter(function(x){return x.d>0.4;})};}

var SC={wL:2,wR:3,ang:0,vel:0,target:0,raf:0};
function initScale(){
  var L=document.getElementById("panL"),R=document.getElementById("panR");if(!L)return;
  var labs=S.lang==="ar"?[t("panB"),t("panA")]:[t("panA"),t("panB")];
  L.querySelector(".panlab").textContent=labs[0];R.querySelector(".panlab").textContent=labs[1];
  function add(side){if(side==="L")SC.wL=SC.wL>=5?1:SC.wL+1;else SC.wR=SC.wR>=5?1:SC.wR+1;drawBlocks();setTarget();}
  [[L,"L"],[R,"R"]].forEach(function(x){x[0].onclick=function(){add(x[1]);};x[0].onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();add(x[1]);}};});
  drawBlocks();SC.ang=0;SC.vel=0;setTarget();if(reduce){SC.ang=SC.target;place();}
}
function drawBlocks(){[["L",SC.wL],["R",SC.wR]].forEach(function(x){var g=document.querySelector("#pan"+x[0]+" .blocks");if(!g)return;var h="";
  for(var i=0;i<x[1];i++){h+='<rect x="'+(-30+((i%2)*4))+'" y="'+(80-i*13)+'" width="60" height="11" rx="3" fill="#F2B544" stroke="#5B3D00" stroke-opacity=".25"/>';}g.innerHTML=h;});}
function setTarget(){SC.target=Math.max(-12,Math.min(12,(SC.wR-SC.wL)*4));if(reduce){SC.ang=SC.target;place();return;}if(!SC.raf)SC.raf=requestAnimationFrame(tick);}
var last=0;
function tick(ts){var dt=Math.min(0.032,last?(ts-last)/1000:0.016);last=ts;
  var k=90,c=11,a=-k*(SC.ang-SC.target)-c*SC.vel;SC.vel+=a*dt;SC.ang+=SC.vel*dt;place();
  if(Math.abs(SC.ang-SC.target)<0.01&&Math.abs(SC.vel)<0.01){SC.ang=SC.target;place();SC.raf=0;last=0;return;}
  SC.raf=requestAnimationFrame(tick);}
function place(){var b=document.getElementById("beamG");if(!b)return;var r=SC.ang*Math.PI/180;
  b.setAttribute("transform","rotate("+SC.ang.toFixed(3)+" 260 96)");
  [["L",-180],["R",180]].forEach(function(x){var px=260+x[1]*Math.cos(r),py=96+x[1]*Math.sin(r);var g=document.getElementById("pan"+x[0]);if(g)g.setAttribute("transform","translate("+px.toFixed(2)+" "+py.toFixed(2)+")");});}

var io=null;
function observe(){
  var els=document.querySelectorAll(".reveal");
  if(reduce||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  if(io)io.disconnect();
  io=new IntersectionObserver(function(ents){ents.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:0.2,rootMargin:"0px 0px -6% 0px"});
  els.forEach(function(e){io.observe(e);});
}

function aggregate(rows,part,filter){var use=rows.filter(function(r){return filter(r)&&r["cr"+part]<0.1;});if(!use.length)return {n:0};
  var vals=PAIRS.map(function(p,k){var s=0;use.forEach(function(r){s+=Math.log(val(r[part][k]));});return Math.exp(s/use.length);});
  var R=ahp(matrixFromVals(vals,N,PAIRS));return {n:use.length,w:R.w,CR:R.CR};}

     .then(function(r){return r.json();}).then(function(d){

  var gname=function(k){return nm(GROUPS.filter(function(x){return x.k===k;})[0]);},sname=function(k){return nm(GENDERS.filter(function(x){return x.k===k;})[0]);};
  var h='<h2>'+esc(t("respTable"))+' ('+rows.length+')</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>'+t("grp")+'</th><th>'+t("gen")+'</th><th>'+t("crA")+'</th><th>'+t("crB")+'</th></tr></thead><tbody>';

  h+='</tbody></table></div>';

  groups.push({label:t("all"),f:function(){return true;},tot:rows.length});
  [["A",CRIT,"resA"],["B",CHAN,"resB"]].forEach(function(spec){var part=spec[0],items=spec[1];h+='<h2 style="margin-top:28px">'+esc(t(spec[2]))+'</h2>';
    var aggs=groups.map(function(g){return aggregate(rows,part,g.f);});
    h+='<div class="tablewrap"><table><thead><tr><th></th>'+groups.map(function(g,i){return '<th>'+esc(g.label)+'<br><span class="note">'+esc(t("nUsed")(aggs[i].n,g.tot))+'</span></th>';}).join("")+'</tr></thead><tbody>';
    items.forEach(function(o,i){h+='<tr><td style="text-align:start">'+esc(nm(o))+'</td>'+aggs.map(function(a){return '<td>'+(a.n?(a.w[i]*100).toFixed(1)+'%':'-')+'</td>';}).join("")+'</tr>';});
    h+='</tbody></table></div>';var all=aggs[aggs.length-1];
    h+='<div class="card"><strong>'+esc(t("all"))+'</strong>'+(all.n?barsHTML(items,all.w)+'<div class="cr">'+esc(t("cr"))+': '+all.CR.toFixed(3)+'</div>':'<p class="note">'+esc(t("noData"))+'</p>')+'</div>';});
  var gEN={F:"Faculty",G:"Recent graduate",S:"Final-year student"},sEN={M:"Male",W:"Female"};
  var tsv=rows.map(function(r,i){return ["R"+(i+1),gEN[r.g],sEN[r.s]].concat(r.A,r.B).join("\t");}).join("\n");
  h+='<div class="btns"><button class="btn ghost" id="csv" type="button">'+esc(t("csv"))+'</button></div><textarea class="paste hidden" id="tsv" readonly>'+tsv+'</textarea>';
  out.innerHTML=h;
  document.getElementById("csv").onclick=function(){var ta=document.getElementById("tsv");ta.classList.remove("hidden");copyText(tsv,this,ta,t("csvDone"));};
}

/* ---------- init ---------- */
document.getElementById("langBtn").onclick=function(){S.lang=S.lang==="ar"?"en":"ar";render();};
document.getElementById("researcherLink").onclick=function(){S.view=S.view==="research"?"landing":"research";render();window.scrollTo(0,0);};
render();
})();
</script></body></html>
